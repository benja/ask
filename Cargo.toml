[package]
name = "ask-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A tiny, read-only CLI wrapper for local coding agents"
license = "MIT"
repository = "https://github.com/benja/ask"
readme = "README.md"
publish = false

[[bin]]
name = "ask"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
serde_json = "1"
unicode-width = { version = "0.2", default-features = false }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
