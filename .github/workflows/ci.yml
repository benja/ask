name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test installer
        run: sh tests/install.sh
      - name: Lint installer
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/install.sh

  msrv:
    name: Rust 1.88 minimum
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked
